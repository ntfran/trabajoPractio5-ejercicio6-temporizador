<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 5 - Cronómetro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body
    class="bg-dark text-white min-vh-100 d-flex align-items-center justify-content-center p-3"
  >
    <main class="card contenedor-reloj shadow-lg text-center" id="card">
      <header class="seccion-fecha p-3 border-bottom border-dark-subtle">
        <h1 class="h5 m-0 text-uppercase fw-bold">Cronómetro</h1>
      </header>

      <section
        class="seccion-hora p-3 p-md-4 p-lg-5 d-flex align-items-center justify-content-center"
      >
        <div class="bloque-principal d-flex align-items-center">
          <span id="horas">00</span>
          <span class="separador mx-1">:</span>
          <span id="minutos">00</span>
          <span class="separador mx-1">:</span>
          <span id="segundos">00</span>
        </div>
      </section>

      <footer
        class="p-3 border-top border-dark-subtle d-flex justify-content-center gap-2"
      >
        <button id="btnIniciar" class="btn btn-success px-3">Iniciar</button>
        <button id="btnPausar" class="btn btn-warning px-3" disabled>
          Pausar
        </button>
        <button id="btnReiniciar" class="btn btn-danger px-3" disabled>
          Reiniciar
        </button>
      </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
